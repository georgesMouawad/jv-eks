name: Deploy

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            environment:
                description: Target environment
                required: true
                default: dev
                type: choice
                options:
                    - dev
                    - prod

permissions:
    contents: read

env:
    AWS_REGION: eu-central-1

jobs:
    # ──────────────────────────────────────────────────────────────────────────
    # 1. Test — run backend Gradle tests before build and push
    # ──────────────────────────────────────────────────────────────────────────
    test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              name: Checkout code

            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  java-version: '25'
                  distribution: 'temurin'
                  cache: gradle

            - name: Ensure Gradle wrapper is executable
              run: chmod +x ./gradlew
              working-directory: server

            - name: Run tests with Gradle
              run: ./gradlew test --no-daemon
              working-directory: server

    # ──────────────────────────────────────────────────────────────────────────
    # 2. Build & push — parallel matrix across all 5 services
    # ──────────────────────────────────────────────────────────────────────────
    build-and-push:
        name: Build & Push (${{ matrix.service }})
        needs: test
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        strategy:
            matrix:
                include:
                    # ── Backend services (built from server/ root for multi-module Gradle) ──
                    - service: auth-service
                      context: server
                      dockerfile: server/services/auth-service/Dockerfile
                    - service: user-service
                      context: server
                      dockerfile: server/services/user-service/Dockerfile
                    - service: api-gateway
                      context: server
                      dockerfile: server/services/api-gateway/Dockerfile
                    - service: crate-service
                      context: server
                      dockerfile: server/services/crate-service/Dockerfile
                    - service: sync-service
                      context: server
                      dockerfile: server/services/sync-service/Dockerfile
                    # ── Frontend ────────────────────────────────────────────────────────────
                    - service: client
                      context: client
                      dockerfile: client/Dockerfile

        steps:
            - uses: actions/checkout@v4
              name: Checkout code

            - name: Configure AWS credentials (OIDC)
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and push image
              env:
                  REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  REPO: jv-eks-dev/${{ matrix.service }}
                  TAG: ${{ github.sha }}
              run: |
                  SHORT_SHA="${TAG::8}"
                  IMAGE="${REGISTRY}/${REPO}"

                  docker build \
                    -f ${{ matrix.dockerfile }} \
                    -t "${IMAGE}:${SHORT_SHA}" \
                    -t "${IMAGE}:latest" \
                    ${{ matrix.context }}

                  docker push "${IMAGE}:${SHORT_SHA}"
                  docker push "${IMAGE}:latest"

    # ──────────────────────────────────────────────────────────────────────────
    # 3. Update manifests — commit new image tag; ArgoCD syncs the rest
    # ──────────────────────────────────────────────────────────────────────────
    update-manifests:
        name: Update image tags
        needs: build-and-push
        runs-on: ubuntu-latest
        permissions:
            contents: write 

        steps:
            - uses: actions/checkout@v4
              with:
                  # If branch protection is enabled on main, replace GITHUB_TOKEN
                  # with a PAT stored as secret GH_PAT:
                  #   token: ${{ secrets.GH_PAT }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Update image tags in kustomization files
              run: |
                  SHORT_SHA="${GITHUB_SHA::8}"
                  sed -i "s|newTag: .*|newTag: ${SHORT_SHA}|g" \
                    k8s/overlays/dev/kustomization.yaml \
                    k8s/overlays/prod/kustomization.yaml

            - name: Commit and push
              run: |
                  SHORT_SHA="${GITHUB_SHA::8}"
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add k8s/overlays/dev/kustomization.yaml \
                          k8s/overlays/prod/kustomization.yaml
                  # Exit cleanly if nothing changed (e.g. re-run on same SHA)
                  git diff --staged --quiet && exit 0
                  git commit -m "ci: update image tags to ${SHORT_SHA} [skip ci]"
                  git push
