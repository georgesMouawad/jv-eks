name: CI

on:
    push:
        branches-ignore:
            - main
        paths-ignore:
            - 'k8s/**'
            - '.github/workflows/deploy.yml'
    pull_request:
        paths-ignore:
            - 'k8s/**'
            - '.github/workflows/deploy.yml'
jobs:
    compile:
        name: Compile
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              name: Checkout code
            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  java-version: '25'
                  distribution: 'temurin'
                  cache: gradle
            - name: Ensure Gradle wrapper is executable
              run: chmod +x ./gradlew
              working-directory: server
            - name: Compile with Gradle
              run: ./gradlew compileJava --no-daemon
              working-directory: server
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              name: Checkout code
            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  java-version: '25'
                  distribution: 'temurin'
                  cache: gradle
            - name: Ensure Gradle wrapper is executable
              run: chmod +x ./gradlew
              working-directory: server
            - name: Run tests with Gradle
              run: ./gradlew test --no-daemon
              working-directory: server
    build:
        name: Build
        needs:
            - compile
            - test
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - service: auth-service
                      context: server
                      dockerfile: server/services/auth-service/Dockerfile
                    - service: user-service
                      context: server
                      dockerfile: server/services/user-service/Dockerfile
                    - service: api-gateway
                      context: server
                      dockerfile: server/services/api-gateway/Dockerfile
                    - service: crate-service
                      context: server
                      dockerfile: server/services/crate-service/Dockerfile
                    - service: sync-service
                      context: server
                      dockerfile: server/services/sync-service/Dockerfile
        steps:
            - uses: actions/checkout@v4
              name: Checkout code
            - name: Build Docker image
              run: |
                  docker build \
                  -f ${{ matrix.dockerfile }} \
                  -t "devops/${{ matrix.service }}:latest" \
                  ${{ matrix.context }}
